[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-agent"
version = "0.1.0"
description = "Autonomous data-analyst agent over the Telco customer-churn dataset"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
app = ["streamlit>=1.37", "matplotlib>=3.9"]
dev = ["pytest>=8.2", "matplotlib>=3.9", "ipykernel", "nbformat", "nbclient", "jupyter-client"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
